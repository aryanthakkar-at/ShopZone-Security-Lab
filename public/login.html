<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopZone Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;

            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 5px;

            margin-bottom: 20px;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 5px;

            background: #222;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .lab-note {
            margin-top: 25px;
            padding: 15px;

            background: #fff3cd;
            border: 1px solid #ffeeba;

            font-size: 14px;
            line-height: 1.5;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            ShopZone
        </div>

        <p class="subtitle">
            Sign in to your account
        </p>


        <form action="/login" method="POST">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="lab-note">

            <strong>Local Security Lab</strong>

            <p>
                This login system is part of an intentionally vulnerable
                application used for cybersecurity practice.
            </p>

        </div>

    </div>

</body>

</html>
